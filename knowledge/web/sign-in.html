<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafbf8">
  <title>Sign in — Figuring Out</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/reader.css">
  <script src="/sign-in.js" defer></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="wordmark" href="/" aria-label="Figuring Out home"><span>FIGURING<br>OUT<span class="wordmark-dot">.</span></span></a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode">
      <svg class="icon theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.1A8.5 8.5 0 0 1 10.9 3.5a8.5 8.5 0 1 0 9.6 9.6Z"/></svg>
      <svg class="icon theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
    </button>
  </header>
  <main class="auth-main">
    <h1>Sign in to Figuring Out.</h1>
    <p>Your questions, answers, and collections stay in your account.</p>
    <a id="sign-in-link" class="solid-button" href="/auth/login">Sign in or create an account <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
  </main>
</body>
</html>
